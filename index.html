<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제3대항전술대대 - 메인</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', sans-serif; }
        body { background-color: #f8fafc; color: #1e293b; }
        
        /* 상단 네비게이션 */
        header { position: fixed; top: 0; width: 100%; background: #ffffff; border-bottom: 1px solid #e2e8f0; z-index: 1000; }
        .nav-container { max-width: 1200px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; }
        .logo { font-size: 1.4rem; font-weight: 800; color: #0f172a; text-decoration: none; }
        .nav-menu { display: flex; list-style: none; gap: 1.5rem; }
        .nav-menu a { text-decoration: none; color: #475569; font-weight: 600; padding: 0.5rem 0.8rem; border-radius: 6px; transition: 0.2s; }
        .nav-menu a:hover, .nav-menu a.active { color: #2563eb; background: #eff6ff; }
        
        /* 메인 컨테이너 */
        main { max-width: 1100px; margin: 120px auto 60px; padding: 0 2rem; }
        
        /* 실시간 시계 & 현황 위젯 */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
        .widget { background: #ffffff; padding: 1.8rem; border-radius: 12px; border: 1px solid #e2e8f0; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        .widget-title { font-size: 0.9rem; color: #64748b; font-weight: 600; text-transform: uppercase; margin-bottom: 0.5rem; }
        .clock-display { font-size: 1.8rem; font-weight: 800; color: #0f172a; font-family: monospace; }
        .stat-number { font-size: 2rem; font-weight: 800; color: #2563eb; }

        /* 히어로 섹션 */
        .hero { background: #ffffff; padding: 4rem 3rem; border-radius: 16px; border: 1px solid #e2e8f0; text-align: center; margin-bottom: 3rem; }
        .hero h1 { font-size: 2.8rem; color: #0f172a; margin-bottom: 1rem; font-weight: 800; }
        .hero p { font-size: 1.2rem; color: #475569; max-width: 600px; margin: 0 auto 2rem; }
        .btn { display: inline-block; background: #2563eb; color: #fff; padding: 0.8rem 1.8rem; border-radius: 8px; text-decoration: none; font-weight: 700; transition: 0.2s; }
        .btn:hover { background: #1d4ed8; }

        footer { text-align: center; padding: 2rem; color: #94a3b8; font-size: 0.9rem; border-top: 1px solid #e2e8f0; }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo">🛡️ 제3대항전술대대</a>
            <ul class="nav-menu">
                <li><a href="index.html" class="active">홈</a></li>
                <li><a href="greeting.html">대대장 인사말</a></li>
                <li><a href="organization.html">대대/중대 소개</a></li>
                <li><a href="promo.html">홍보 & 소식</a></li>
            </ul>
        </div>
    </header>

    <main>
        <!-- 실시간 시계 및 대시보드 현황 -->
        <div class="dashboard-grid">
            <div class="widget">
                <div class="widget-title">⏱️ 현재 시간 (KST)</div>
                <div class="clock-display" id="clock">00:00:00</div>
            </div>
            <div class="widget">
                <div class="widget-title">📊 누적 방문자 수</div>
                <div class="stat-number">1,248 <span style="font-size: 1rem; color: #64748b; font-weight: 400;">명</span></div>
            </div>
            <div class="widget">
                <div class="widget-title">🟢 부대 웹사이트 상태</div>
                <div style="font-size: 1.3rem; font-weight: 700; color: #16a34a; margin-top: 0.3rem;">정상 운영 중</div>
            </div>
        </div>

        <!-- 메인 히어로 카드 -->
        <div class="hero">
            <h1>실전적 훈련과 최정예 전술</h1>
            <p>자유와 평화를 수호하는 제3대항전술대대 공식 웹사이트에 오신 것을 환영합니다.</p>
            <a href="greeting.html" class="btn">대대장 인사말 보러가기 →</a>
        </div>
    </main>

    <footer>
        &copy; 2026 제3대항전술대대. All rights reserved.
    </footer>

    <script>
        // 시계 스크립트
        function updateClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
