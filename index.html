<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>제3대항전술대대 | 3RD TACTICAL BATTALION</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-primary: #0b0f19;
            --bg-card: rgba(17, 24, 39, 0.7);
            --accent-gold: #d4af37;
            --accent-blue: #3b82f6;
            --text-main: #f3f4f6;
            --text-muted: #9ca3af;
            --border-color: rgba(255, 255, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
        
        body {
            background-color: var(--bg-primary);
            color: var(--text-main);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(212, 175, 55, 0.05) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* 네비게이션 바 */
        header {
            position: fixed;
            top: 0; left: 0; width: 100%;
            background: rgba(11, 15, 25, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            z-index: 1000;
        }

        .nav-container {
            max-width: 1300px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.2rem 2rem;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            text-decoration: none;
            color: var(--text-main);
        }

        .logo-icon {
            width: 38px; height: 38px;
            background: linear-gradient(135deg, #1e3a8a, #3b82f6);
            border: 1px solid var(--accent-gold);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.1rem; color: var(--accent-gold);
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.3);
        }

        .logo-text {
            font-size: 1.15rem;
            font-weight: 700;
            letter-spacing: 1px;
            background: linear-gradient(to right, #ffffff, #9ca3af);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-menu {
            display: flex;
            list-style: none;
            gap: 2rem;
        }

        .nav-menu a {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            position: padding;
        }

        .nav-menu a:hover, .nav-menu a.active {
            color: var(--accent-gold);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        /* 메인 컨텐츠 영역 */
        main {
            max-width: 1200px;
            margin: 140px auto 60px;
            padding: 0 2rem;
            width: 100%;
        }

        /* 상단 대시보드 위젯 */
        .dashboard-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.5rem;
            margin-bottom: 2.5rem;
        }

        .widget {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            backdrop-filter: blur(10px);
            padding: 1.8rem;
            border-radius: 16px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, border-color 0.3s ease;
        }

        .widget:hover {
            transform: translateY(-4px);
            border-color: rgba(212, 175, 55, 0.3);
        }

        .widget::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 4px; height: 100%;
            background: var(--accent-gold);
        }

        .widget-title {
            font-size: 0.85rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .clock-display {
            font-size: 1.8rem;
            font-weight: 700;
            font-family: 'Courier New', monospace;
            color: #fff;
            letter-spacing: 1px;
        }

        .stat-number {
            font-size: 2rem;
            font-weight: 800;
            color: var(--accent-gold);
        }

        /* 히어로 섹션 */
        .hero {
            background: linear-gradient(135deg, rgba(17, 24, 39, 0.8), rgba(30, 41, 59, 0.5));
            border: 1px solid var(--border-color);
            border-radius: 24px;
            padding: 5rem 3rem;
            text-align: center;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .hero-badge {
            display: inline-block;
            background: rgba(212, 175, 55, 0.1);
            color: var(--accent-gold);
            border: 1px solid rgba(212, 175, 55, 0.3);
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            letter-spacing: 1px;
        }

        .hero h1 {
            font-size: 3.2rem;
            font-weight: 800;
            margin-bottom: 1.2rem;
            background: linear-gradient(to bottom, #ffffff 30%, #9ca3af 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -1px;
        }

        .hero p {
            font-size: 1.15rem;
            color: var(--text-muted);
            max-width: 650px;
            margin: 0 auto 2.5rem;
            line-height: 1.7;
        }

        .btn-gold {
            display: inline-flex;
            align-items: center;
            gap: 0.8rem;
            background: linear-gradient(135deg, #d4af37, #aa7c11);
            color: #0b0f19;
            padding: 1rem 2.2rem;
            border-radius: 10px;
            font-weight: 700;
            text-decoration: none;
            transition: all 0.3s ease;
            box-shadow: 0 4px 20px rgba(212, 175, 55, 0.3);
        }

        .btn-gold:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 25px rgba(212, 175, 55, 0.5);
            background: linear-gradient(135deg, #e6c555, #bd8a16);
        }

        footer {
            text-align: center;
            padding: 2.5rem;
            color: var(--text-muted);
            font-size: 0.85rem;
            border-top: 1px solid var(--border-color);
            background: rgba(11, 15, 25, 0.5);
        }

        @media(max-width: 768px) {
            .hero h1 { font-size: 2.2rem; }
            .nav-menu { display: none; }
        }
    </style>
</head>
<body>

    <header>
        <div class="nav-container">
            <a href="index.html" class="logo-box">
                <div class="logo-icon"><i class="fa-solid fa-shield-halved"></i></div>
                <span class="logo-text">제3대항전술대대</span>
            </a>
            <ul class="nav-menu">
                <li><a href="index.html" class="active">홈</a></li>
                <li><a href="greeting.html">대대장 인사말</a></li>
                <li><a href="organization.html">대대/중대 소개</a></li>
                <li><a href="promo.html">홍보 & 소식</a></li>
            </ul>
        </div>
    </header>

    <main>
        <!-- 실시간 위젯 대시보드 -->
        <div class="dashboard-grid">
            <div class="widget">
                <div class="widget-title"><i class="fa-regular fa-clock"></i> 표준시각 (KST)</div>
                <div class="clock-display" id="clock">00:00:00</div>
            </div>
            <div class="widget">
                <div class="widget-title"><i class="fa-solid fa-chart-line"></i> 누적 방문자 현황</div>
                <div class="stat-number">3,852 <span style="font-size: 1rem; color: var(--text-muted); font-weight: 400;">명</span></div>
            </div>
            <div class="widget">
                <div class="widget-title"><i class="fa-solid fa-circle-check"></i> 시스템 상태</div>
                <div style="font-size: 1.2rem; font-weight: 700; color: #34d399; margin-top: 0.4rem; display: flex; align-items: center; gap: 0.5rem;">
                    <span style="width: 10px; height: 10px; background: #34d399; border-radius: 50%; display: inline-block; box-shadow: 0 0 10px #34d399;"></span>
                    보안 및 통신 원활
                </div>
            </div>
        </div>

        <!-- 메인 히어로 -->
        <div class="hero">
            <div class="hero-badge">3RD TACTICAL BATTALION</div>
            <h1>실전적 훈련과 최정예 전술의 중추</h1>
            <p>완벽한 전투태세와 철저한 임무 수행 능력으로 조국의 평화와 안전을 최선두에서 수호합니다.</p>
            <a href="greeting.html" class="btn-gold">대대장 인사말 확인하기 <i class="fa-solid fa-arrow-right"></i></a>
        </div>
    </main>

    <footer>
        &copy; 2026 제3대항전술대대 (3rd Tactical Battalion). All Rights Reserved.
    </footer>

    <script>
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('clock').innerText = `${h}:${m}:${s}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
